<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RULE THE WORLDS</title>
</head>

<body>
  <div id="app">
    <div id="leftPane">
      <div id="headerBrand">
        <a id="headerBrandLink" href="https://rule-the-worlds.master-ferrari.com">rule-the-worlds.master-ferrari.com</a>
      </div>
      <div id="controlPanel">
        <div class="controlLine">
          <span id="info"></span>
          <span class="controlSep">|</span>
          <span id="simInfo"></span>
        </div>
        <div class="controlLine">
          <button id="importRuleName" class="controlButton">import rule</button>
          <button id="openWolfram" class="controlButton">on Wolfram</button>
          <button id="exportPng" class="controlButton">export png</button>
          <button id="shareLink" class="controlButton">copy link</button>
        </div>
        <div class="controlLine">
          <label>width <input type="number" id="width" value="720" min="1" step="1"></label>
          <label>scale <input type="number" id="zoom" value="2" min="1" step="1"></label>
          <label>center <input type="number" id="seedBand" value="25" min="1" step="1"></label>
        </div>
        <div class="controlLine">
          <label>seed <input type="number" id="seed" value="5" min="0" step="1"></label>
          <button id="newRandom" class="controlButton">random seed</button>
          <label>edge
            <span class="selectControl">
              <select id="boundaryMode">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="wrap">wrap</option>
              </select>
              <span class="selectArrow" aria-hidden="true">
                <svg class="numberSpinIcon" viewBox="0 0 9 5">
                  <path d="M1 1L4.5 4L8 1" />
                </svg>
              </span>
            </span>
          </label>
        </div>
        <div class="controlLine">
          <label>steps <input type="number" id="steps" value="1500" min="1"></label>
          <label class="checkboxControl"><input type="checkbox" id="stepsAuto">triangle canvas</label>
          <label class="checkboxControl"><input type="checkbox" id="autoUpdate" checked>update on edits</label>
          <label class="checkboxControl"><input type="checkbox" id="colored">colored</label>
        </div>
        <div class="controlLine">
          <label>speed <input type="number" id="playSpeed" value="10" min="1" step="1"></label>
          <button id="playBtn" class="controlButton">play</button>
        </div>
      </div>
      <div id="hSplitter"></div>
      <textarea id="rules" spellcheck="false"># creepers
10(1)01
01(0)10
01(0)00 -s
#1(x)1
1(1)1
</textarea>
      <div id="errorsPanel" class="hidden">
        <div id="errorsHeader">
          <span>errors</span>
          <div id="errorsHeaderBtns">
            <button id="syntaxInfo" class="errorsCloseBtn" type="button">info</button>
            <button id="errorsClose" class="errorsCloseBtn" type="button" aria-label="Hide errors">x</button>
          </div>
        </div>
        <div id="errorsList"></div>
      </div>
    </div>
    <div id="splitter"></div>
    <div id="canvasWrap">
      <div id="canvas-holder">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
