<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rule Predictor — Cellular Automaton</title>
</head>
<body>
  <div id="app">
    <div id="leftHeader">
      <p class="help">Format: left(center)right&gt;output (0/1/x) &nbsp; e.g. 1(x)1&gt;1</p>
      <div id="info"></div>
    </div>
    <div id="rightHeader">
      <label>Width <input type="number" id="width" value="750" min="11" step="10"></label>
      <label>Scale <input type="number" id="zoom" value="2" min="1" step="1"></label>
      <label>Seed <input type="number" id="seed" value="5" min="0" step="1"></label>
      <label>Center <input type="number" id="seedBand" value="25" min="1" step="1"></label>
      <button id="newRandom" class="controlButton">New Random</button>
      <span id="stepsAutoGroup">
        <label>Steps <input type="number" id="steps" value="2000" min="1"></label>
        <label class="checkboxControl"><input type="checkbox" id="stepsAuto">Auto</label>
        <label class="checkboxControl"><input type="checkbox" id="autoUpdate" checked>AutoUpdate</label>
      </span>
      <span id="simInfo"></span>
    </div>
    <textarea id="rules" spellcheck="false"># creepers
10(1)01>1
01(1)10>1
01(0)10>1
01(0)00>1
00(0)10>1
1(1)1>1
</textarea>
    <div id="splitter"></div>
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
